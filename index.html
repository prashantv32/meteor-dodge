<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Meteor Dodge</title>
  <style>
    /* Reset & full viewport container styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #04060d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none; /* Prevents mobile browser pull-to-refresh & gestures */
    }

    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      max-height: 100vh;
      padding: 8px 12px;
    }

    /* Responsive canvas scaling preserving exact 4:5 (600:750) aspect ratio */
    canvas {
      display: block;
      width: min(600px, 94vw, calc((94vh - 46px) * 0.8));
      height: auto;
      aspect-ratio: 600 / 750;
      touch-action: none;
      background: radial-gradient(ellipse at bottom, #090e1f 0%, #03050a 85%);
      box-shadow: 0 0 35px rgba(18, 38, 85, 0.45), 0 0 10px rgba(0, 0, 0, 0.9);
      border: 2px solid #162444;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Responsive controls & legend footer */
    .controls-hint {
      margin-top: 10px;
      font-size: clamp(11px, 2.5vw, 13px);
      color: #6272a4;
      letter-spacing: 0.4px;
      text-align: center;
      line-height: 1.4;
    }

    .controls-hint .key {
      color: #00f3ff;
      font-weight: 600;
    }

    .controls-hint .power-shield {
      color: #00ff88;
      font-weight: 600;
    }

    .controls-hint .power-slow {
      color: #38b6ff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="750"></canvas>
    <div class="controls-hint">
      Steer: <span class="key">A / D</span>, <span class="key">&larr; / &rarr;</span> or <span class="key">Drag</span> &nbsp;|&nbsp; 
      Start: <span class="key">Space / Tap</span> &nbsp;|&nbsp;
      Mute: <span class="key">M / Tap 🔊</span><br>
      Orbs: <span class="power-shield">🛡️ Shield</span> &bull; <span class="power-slow">⏱ Slow-Mo</span>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. CANVAS & CORE GAME STATE
    // =========================================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CANVAS_WIDTH = canvas.width;
    const CANVAS_HEIGHT = canvas.height;

    // Game lifecycle states: 'START' | 'PLAYING' | 'GAMEOVER'
    let gameState = 'START';
    let elapsedTime = 0;       // Total seconds survived in current run
    let score = 0;             // Score = floor(seconds survived)
    let finalScore = 0;
    let isNewHighScore = false;
    let lastFrameTime = 0;     // Timestamp tracking for delta time

    // Persistent High Score handling
    const HIGH_SCORE_KEY = 'meteor_dodge_high_score';
    function loadHighScore() {
      try {
        const stored = localStorage.getItem(HIGH_SCORE_KEY);
        return stored ? parseInt(stored, 10) || 0 : 0;
      } catch (err) {
        return 0;
      }
    }

    let highScore = loadHighScore();
    let previousHighScore = highScore;

    function saveHighScore(newScore) {
      highScore = newScore;
      try {
        localStorage.setItem(HIGH_SCORE_KEY, highScore.toString());
      } catch (err) {
        // Safe fallback if local storage is restricted
      }
    }

    // Power-up durations & constants
    let shieldTimer = 0;
    const SHIELD_MAX_DURATION = 5.0;

    let slowMoTimer = 0;
    const SLOWMO_MAX_DURATION = 4.0;
    const SLOWMO_SPEED_FACTOR = 0.35; // Meteors drop at 35% speed during slow-mo

    // Keyboard state
    const keys = {
      left: false,
      right: false
    };

    // Touch & pointer drag state
    let isPointerDown = false;
    let pointerStartX = 0;
    let shipStartX = 0;

    // =========================================================================
    // 2. SYNTHESIZED WEB AUDIO API SOUND SYSTEM (NO EXTERNAL AUDIO FILES)
    // =========================================================================
    let audioCtx = null;
    let isMuted = false;

    // Initialize or resume AudioContext on user gesture
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          try {
            audioCtx = new AudioContextClass();
          } catch (e) {
            // AudioContext not allowed yet
          }
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleMute() {
      initAudio();
      isMuted = !isMuted;
    }

    // Power-up pickup chime (crisp ascending sweep)
    function playBlipSound() {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.07);
      osc.frequency.exponentialRampToValueAtTime(1320, now + 0.15);

      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.16);
    }

    // Explosion rumble (deep bass thump + filtered noise burst)
    function playExplosionSound() {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      // 1. Low bass pitch decay oscillator
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(28, now + 0.55);

      oscGain.gain.setValueAtTime(0.4, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.55);

      // 2. Filtered white noise burst for rumble texture
      const bufferSize = Math.floor(audioCtx.sampleRate * 0.5);
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(320, now);
      filter.frequency.exponentialRampToValueAtTime(40, now + 0.5);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.35, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

      whiteNoise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);

      whiteNoise.start(now);
      whiteNoise.stop(now + 0.5);
    }

    // Shield breaking a meteor sound
    function playShieldShatterSound() {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.12);
    }

    // =========================================================================
    // 3. PARALLAX STARFIELD BACKGROUND
    // =========================================================================
    const starLayers = [
      { count: 65, minSpeed: 16,  maxSpeed: 28,  minR: 0.6, maxR: 1.1, baseAlpha: 0.35, stars: [] }, // Far
      { count: 35, minSpeed: 45,  maxSpeed: 70,  minR: 1.2, maxR: 1.8, baseAlpha: 0.65, stars: [] }, // Mid
      { count: 18, minSpeed: 95,  maxSpeed: 140, minR: 2.0, maxR: 2.8, baseAlpha: 0.95, stars: [] }  // Near
    ];

    function initStarfield() {
      for (const layer of starLayers) {
        layer.stars = [];
        for (let i = 0; i < layer.count; i++) {
          layer.stars.push({
            x: Math.random() * CANVAS_WIDTH,
            y: Math.random() * CANVAS_HEIGHT,
            radius: Math.random() * (layer.maxR - layer.minR) + layer.minR,
            speed: Math.random() * (layer.maxSpeed - layer.minSpeed) + layer.minSpeed,
            alpha: layer.baseAlpha,
            twinkleSpeed: Math.random() * 2 + 1,
            twinkleOffset: Math.random() * Math.PI * 2
          });
        }
      }
    }

    function updateStarfield(dt) {
      for (const layer of starLayers) {
        for (const star of layer.stars) {
          star.y += star.speed * dt;
          if (star.y > CANVAS_HEIGHT + 5) {
            star.y = -5;
            star.x = Math.random() * CANVAS_WIDTH;
          }
        }
      }
    }

    function drawStarfield(totalTime) {
      ctx.save();
      for (const layer of starLayers) {
        for (const star of layer.stars) {
          const twinkle = 0.8 + 0.2 * Math.sin(totalTime * star.twinkleSpeed + star.twinkleOffset);
          const currentAlpha = Math.min(1, Math.max(0, star.alpha * twinkle));

          ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // =========================================================================
    // 4. PLAYER (TRIANGLE SHIP WITH SHIELD BUBBLE)
    // =========================================================================
    const player = {
      x: CANVAS_WIDTH / 2,
      y: CANVAS_HEIGHT - 55,
      width: 26,
      height: 34,
      speed: 400,
      shieldRadius: 32,

      reset() {
        this.x = CANVAS_WIDTH / 2;
        this.y = CANVAS_HEIGHT - 55;
      },

      update(dt) {
        if (keys.left && !keys.right) {
          this.x -= this.speed * dt;
        } else if (keys.right && !keys.left) {
          this.x += this.speed * dt;
        }

        // Clamp inside horizontal bounds
        const halfWidth = this.width / 2;
        if (this.x - halfWidth < 0) {
          this.x = halfWidth;
        } else if (this.x + halfWidth > CANVAS_WIDTH) {
          this.x = CANVAS_WIDTH - halfWidth;
        }
      },

      getVertices() {
        const halfW = this.width / 2;
        const halfH = this.height / 2;
        return [
          { x: this.x, y: this.y - halfH },         // Top tip
          { x: this.x - halfW, y: this.y + halfH }, // Bottom-left
          { x: this.x + halfW, y: this.y + halfH }  // Bottom-right
        ];
      },

      draw(totalTime) {
        const halfW = this.width / 2;
        const halfH = this.height / 2;

        ctx.save();

        // 1. Glowing Shield Bubble
        if (shieldTimer > 0) {
          const pulse = 0.85 + 0.15 * Math.sin(totalTime * 8);
          const currentShieldRadius = this.shieldRadius * (0.96 + 0.04 * pulse);

          const shieldGrad = ctx.createRadialGradient(
            this.x, this.y, currentShieldRadius * 0.2,
            this.x, this.y, currentShieldRadius
          );
          shieldGrad.addColorStop(0, 'rgba(0, 255, 136, 0.05)');
          shieldGrad.addColorStop(0.7, 'rgba(0, 255, 136, 0.15)');
          shieldGrad.addColorStop(1, 'rgba(0, 255, 136, 0.45)');

          ctx.beginPath();
          ctx.arc(this.x, this.y, currentShieldRadius, 0, Math.PI * 2);
          ctx.fillStyle = shieldGrad;
          ctx.fill();

          ctx.strokeStyle = '#00ff88';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#00ff88';
          ctx.shadowBlur = 16;
          ctx.stroke();

          // Rotating orbit spark
          const orbitAngle = totalTime * 4;
          const ox = this.x + Math.cos(orbitAngle) * currentShieldRadius;
          const oy = this.y + Math.sin(orbitAngle) * currentShieldRadius;
          ctx.beginPath();
          ctx.arc(ox, oy, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#00ff88';
          ctx.shadowBlur = 10;
          ctx.fill();
        }

        // 2. Thruster Flame (active when moving via keys or dragging)
        if (keys.left || keys.right || isPointerDown) {
          ctx.beginPath();
          ctx.moveTo(this.x - halfW * 0.45, this.y + halfH);
          ctx.lineTo(this.x + halfW * 0.45, this.y + halfH);
          ctx.lineTo(this.x, this.y + halfH + 11 + Math.random() * 6);
          ctx.closePath();
          ctx.fillStyle = '#ff7b00';
          ctx.shadowColor = '#ff3b00';
          ctx.shadowBlur = 12;
          ctx.fill();
        }

        // 3. Triangle Ship Hull
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - halfH);          // Nose tip
        ctx.lineTo(this.x - halfW, this.y + halfH);  // Bottom-left
        ctx.lineTo(this.x, this.y + halfH - 4);      // Engine groove
        ctx.lineTo(this.x + halfW, this.y + halfH);  // Bottom-right
        ctx.closePath();

        ctx.fillStyle = '#00f3ff';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.shadowColor = '#00f3ff';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.stroke();

        // Cockpit canopy detail
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - halfH * 0.3);
        ctx.lineTo(this.x - halfW * 0.3, this.y + halfH * 0.2);
        ctx.lineTo(this.x + halfW * 0.3, this.y + halfH * 0.2);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 0;
        ctx.fill();

        ctx.restore();
      }
    };

    // =========================================================================
    // 5. METEORS & 10-SECOND DIFFICULTY RAMP
    // =========================================================================
    const meteors = [];
    let meteorSpawnTimer = 0;

    function getDifficultyTier() {
      return Math.floor(score / 10);
    }

    function getCurrentSpawnInterval() {
      const tier = getDifficultyTier();
      return Math.max(0.15, 0.60 - tier * 0.055);
    }

    class Meteor {
      constructor() {
        this.radius = Math.random() * 22 + 12;
        this.x = Math.random() * (CANVAS_WIDTH - this.radius * 2) + this.radius;
        this.y = -this.radius - Math.random() * 15;

        // Speed ramps up every 10 seconds
        const tier = getDifficultyTier();
        const baseMinSpeed = 150 + tier * 32;
        const baseMaxSpeed = 240 + tier * 45;
        this.speed = Math.random() * (baseMaxSpeed - baseMinSpeed) + baseMinSpeed;

        const grayTone = Math.floor(Math.random() * 40 + 115);
        this.baseColor = `rgb(${grayTone}, ${grayTone}, ${grayTone})`;
        this.craterColor = `rgb(${grayTone - 30}, ${grayTone - 30}, ${grayTone - 30})`;
        this.rimColor = `rgb(${grayTone + 35}, ${grayTone + 35}, ${grayTone + 35})`;

        this.craters = [];
        const craterCount = Math.floor(Math.random() * 3) + 2;
        for (let i = 0; i < craterCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * (this.radius * 0.55);
          this.craters.push({
            cx: Math.cos(angle) * dist,
            cy: Math.sin(angle) * dist,
            r: Math.random() * (this.radius * 0.25) + 2.5
          });
        }
      }

      update(dt) {
        const speedMultiplier = slowMoTimer > 0 ? SLOWMO_SPEED_FACTOR : 1.0;
        this.y += this.speed * speedMultiplier * dt;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.baseColor;
        ctx.fill();

        ctx.strokeStyle = this.rimColor;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        for (const crater of this.craters) {
          ctx.beginPath();
          ctx.arc(crater.cx, crater.cy, crater.r, 0, Math.PI * 2);
          ctx.fillStyle = this.craterColor;
          ctx.fill();
        }

        ctx.restore();
      }
    }

    // =========================================================================
    // 6. POWER-UPS (SHIELD & SLOW-MO ORBS)
    // =========================================================================
    const powerUps = [];
    let powerUpSpawnTimer = 0;
    const POWER_UP_INTERVAL = 11.0;

    class PowerUp {
      constructor(type) {
        this.type = type; // 'shield' | 'slowmo'
        this.radius = 15;
        this.x = Math.random() * (CANVAS_WIDTH - this.radius * 4) + this.radius * 2;
        this.y = -this.radius - 10;
        this.speed = 125;

        if (this.type === 'shield') {
          this.primaryColor = '#00ff88';
          this.glowColor = '#00ff88';
          this.label = 'S';
        } else {
          this.primaryColor = '#00d4ff';
          this.glowColor = '#00d4ff';
          this.label = '⏱';
        }
      }

      update(dt) {
        this.y += this.speed * dt;
      }

      draw(totalTime) {
        ctx.save();
        ctx.translate(this.x, this.y);

        const pulse = 0.8 + 0.2 * Math.sin(totalTime * 6);
        const drawRadius = this.radius * pulse;

        // Outer pulsing ring
        ctx.beginPath();
        ctx.arc(0, 0, drawRadius + 4, 0, Math.PI * 2);
        ctx.strokeStyle = this.glowColor;
        ctx.lineWidth = 1.5;
        ctx.shadowColor = this.glowColor;
        ctx.shadowBlur = 15;
        ctx.stroke();

        // Inner glowing body
        ctx.beginPath();
        ctx.arc(0, 0, drawRadius, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, drawRadius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.6, this.primaryColor);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
        ctx.fillStyle = grad;
        ctx.fill();

        // Symbol label
        ctx.fillStyle = '#05070f';
        ctx.font = 'bold 13px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 0;
        ctx.fillText(this.label, 0, 1);

        ctx.restore();
      }
    }

    function spawnPowerUp() {
      const type = Math.random() < 0.5 ? 'shield' : 'slowmo';
      powerUps.push(new PowerUp(type));
    }

    // =========================================================================
    // 7. PARTICLE SYSTEM (EXPLOSIONS & SPARKLES)
    // =========================================================================
    const particles = [];

    class Particle {
      constructor(x, y, color, speedScale = 1.0, lifeDuration = 0.8) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 260 + 50) * speedScale;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.radius = Math.random() * 3.2 + 1.6;
        this.color = color;
        this.maxLife = Math.random() * (lifeDuration * 0.5) + lifeDuration * 0.5;
        this.life = this.maxLife;
        this.friction = 0.96;
      }

      update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        const decayFactor = Math.pow(this.friction, dt * 60);
        this.vx *= decayFactor;
        this.vy *= decayFactor;
        this.life -= dt;
      }

      draw() {
        if (this.life <= 0) return;
        const progress = Math.max(0, this.life / this.maxLife);

        ctx.save();
        ctx.globalAlpha = progress;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * progress, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function createShipExplosion(x, y) {
      const palette = ['#00f3ff', '#ffffff', '#ffaa00', '#ff4d00', '#ff0055'];
      for (let i = 0; i < 48; i++) {
        const color = palette[Math.floor(Math.random() * palette.length)];
        particles.push(new Particle(x, y, color, 1.0, 0.9));
      }
    }

    function createMeteorShatterExplosion(x, y, radius) {
      const palette = ['#00ff88', '#ffffff', '#aaaaaa', '#777777', '#444444'];
      const count = Math.min(30, Math.floor(radius * 1.2));
      for (let i = 0; i < count; i++) {
        const color = palette[Math.floor(Math.random() * palette.length)];
        particles.push(new Particle(x, y, color, 0.8, 0.6));
      }
    }

    function createPowerUpPickupBurst(x, y, color) {
      for (let i = 0; i < 22; i++) {
        particles.push(new Particle(x, y, color, 0.6, 0.5));
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update(dt);
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawParticles() {
      for (const p of particles) {
        p.draw();
      }
    }

    // =========================================================================
    // 8. ACCURATE COLLISION DETECTION MATH
    // =========================================================================
    function distanceToSegmentSquared(p, a, b) {
      const l2 = (b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y);
      if (l2 === 0) return (p.x - a.x) * (p.x - a.x) + (p.y - a.y) * (p.y - a.y);

      let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
      t = Math.max(0, Math.min(1, t));

      const projX = a.x + t * (b.x - a.x);
      const projY = a.y + t * (b.y - a.y);
      const dx = p.x - projX;
      const dy = p.y - projY;
      return dx * dx + dy * dy;
    }

    function pointInTriangle(p, a, b, c) {
      const d1 = (p.x - b.x) * (a.y - b.y) - (a.x - b.x) * (p.y - b.y);
      const d2 = (p.x - c.x) * (b.y - c.y) - (b.x - c.x) * (p.y - c.y);
      const d3 = (p.x - a.x) * (c.y - a.y) - (c.x - a.x) * (p.y - a.y);

      const hasNeg = (d1 < 0) || (d2 < 0) || (d3 < 0);
      const hasPos = (d1 > 0) || (d2 > 0) || (d3 > 0);
      return !(hasNeg && hasPos);
    }

    function checkCircleTriangleCollision(circle, vertices) {
      const [a, b, c] = vertices;
      const p = { x: circle.x, y: circle.y };
      const r2 = circle.radius * circle.radius;

      if (pointInTriangle(p, a, b, c)) return true;
      if (distanceToSegmentSquared(p, a, b) <= r2) return true;
      if (distanceToSegmentSquared(p, b, c) <= r2) return true;
      if (distanceToSegmentSquared(p, c, a) <= r2) return true;

      return false;
    }

    // =========================================================================
    // 9. GAME STATE CONTROL
    // =========================================================================
    function startNewGame() {
      meteors.length = 0;
      powerUps.length = 0;
      particles.length = 0;
      meteorSpawnTimer = 0;
      powerUpSpawnTimer = 0;
      shieldTimer = 0;
      slowMoTimer = 0;
      elapsedTime = 0;
      score = 0;
      finalScore = 0;
      previousHighScore = highScore;
      isNewHighScore = false;
      lastFrameTime = performance.now();
      player.reset();
      gameState = 'PLAYING';
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      finalScore = score;
      if (finalScore > previousHighScore && finalScore > 0) {
        isNewHighScore = true;
        saveHighScore(finalScore);
      }
      createShipExplosion(player.x, player.y);
      playExplosionSound();
    }

    // =========================================================================
    // 10. INPUT HANDLING (KEYBOARD & TOUCH / POINTER CONTROLS)
    // =========================================================================

    // Translate viewport screen coordinates into canvas internal game coordinates
    function getCanvasCoordinates(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = CANVAS_WIDTH / rect.width;
      const scaleY = CANVAS_HEIGHT / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    // Check if a coordinate hits the mute toggle in HUD
    function isMuteButtonTouched(canvasX, canvasY) {
      return canvasX >= CANVAS_WIDTH - 120 && canvasX <= CANVAS_WIDTH - 10 && canvasY >= 10 && canvasY <= 70;
    }

    // Pointer Events for smooth touch drag, taps, and mouse interactions
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      initAudio();

      const pos = getCanvasCoordinates(e.clientX, e.clientY);

      // Handle touch on the mute button
      if (isMuteButtonTouched(pos.x, pos.y)) {
        toggleMute();
        return;
      }

      // Handle tap to start or restart
      if (gameState === 'START' || gameState === 'GAMEOVER') {
        startNewGame();
        return;
      }

      // Handle dragging during gameplay
      if (gameState === 'PLAYING') {
        isPointerDown = true;
        pointerStartX = e.clientX;
        shipStartX = player.x;
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown || gameState !== 'PLAYING') return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = CANVAS_WIDTH / rect.width;
      const deltaX = (e.clientX - pointerStartX) * scaleX;

      const halfW = player.width / 2;
      player.x = Math.max(halfW, Math.min(CANVAS_WIDTH - halfW, shipStartX + deltaX));
    });

    function endPointerInteraction() {
      isPointerDown = false;
    }

    window.addEventListener('pointerup', endPointerInteraction);
    window.addEventListener('pointercancel', endPointerInteraction);

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key) || e.code === 'Space') {
        e.preventDefault();
      }

      initAudio();

      if (e.code === 'KeyM' || e.key === 'm' || e.key === 'M') {
        toggleMute();
        return;
      }

      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keys.left = true;
      }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keys.right = true;
      }

      if (e.code === 'Space' || e.key === ' ') {
        if (gameState === 'START' || gameState === 'GAMEOVER') {
          startNewGame();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keys.left = false;
      }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keys.right = false;
      }
    });

    // =========================================================================
    // 11. START SCREEN, HUD, AND GAME OVER SCREEN RENDERING
    // =========================================================================

    function drawStartScreen() {
      ctx.save();

      ctx.fillStyle = 'rgba(4, 6, 13, 0.72)';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Title
      ctx.textAlign = 'center';
      ctx.fillStyle = '#00f3ff';
      ctx.font = '900 52px "Segoe UI", sans-serif';
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 24;
      ctx.fillText('METEOR DODGE', CANVAS_WIDTH / 2, 190);

      // Subtitle
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 15px "Segoe UI", sans-serif';
      ctx.letterSpacing = '1px';
      ctx.fillText('ARCADE SURVIVAL IN DEEP SPACE', CANVAS_WIDTH / 2, 226);

      // Ship Icon
      ctx.save();
      ctx.translate(CANVAS_WIDTH / 2, 290);
      ctx.beginPath();
      ctx.moveTo(0, -22);
      ctx.lineTo(-16, 20);
      ctx.lineTo(0, 15);
      ctx.lineTo(16, 20);
      ctx.closePath();
      ctx.fillStyle = '#00f3ff';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Controls & Power-Ups Box
      const boxW = 420;
      const boxH = 150;
      const boxX = (CANVAS_WIDTH - boxW) / 2;
      const boxY = 350;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 10);
      ctx.fill();
      ctx.stroke();

      ctx.font = '600 14px "Segoe UI", sans-serif';
      ctx.fillStyle = '#e2e8f0';
      ctx.textAlign = 'left';
      ctx.fillText('CONTROLS & POWER-UPS', boxX + 20, boxY + 30);

      ctx.font = '13px "Segoe UI", sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('• Move Ship:', boxX + 20, boxY + 58);
      ctx.fillStyle = '#00f3ff';
      ctx.fillText('Drag / A / D / Arrow Keys', boxX + 130, boxY + 58);

      ctx.fillStyle = '#94a3b8';
      ctx.fillText('• Shield Orb:', boxX + 20, boxY + 84);
      ctx.fillStyle = '#00ff88';
      ctx.fillText('Green (5s invulnerable + breaks rock)', boxX + 130, boxY + 84);

      ctx.fillStyle = '#94a3b8';
      ctx.fillText('• Slow-Mo Orb:', boxX + 20, boxY + 110);
      ctx.fillStyle = '#38b6ff';
      ctx.fillText('Blue (4s slow-motion field)', boxX + 130, boxY + 110);

      ctx.fillStyle = '#94a3b8';
      ctx.fillText('• Audio Mute:', boxX + 20, boxY + 134);
      ctx.fillStyle = '#f1f5f9';
      ctx.fillText('M key / Tap Mute Icon', boxX + 130, boxY + 134);

      // Best Score
      if (highScore > 0) {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffd700';
        ctx.font = '600 16px "Segoe UI", sans-serif';
        ctx.fillText(`★ Best Survival Record: ${highScore}s ★`, CANVAS_WIDTH / 2, 535);
      }

      // Pulsing Start Prompt
      const pulse = 0.65 + Math.sin(performance.now() / 220) * 0.35;
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(0, 243, 255, ${pulse})`;
      ctx.font = '700 22px "Segoe UI", sans-serif';
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 14;
      ctx.fillText('Press Space or Tap to Start', CANVAS_WIDTH / 2, 595);

      // Sound status
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#64748b';
      ctx.font = '12px "Segoe UI", sans-serif';
      ctx.fillText(isMuted ? '🔇 Audio Muted (Tap to Toggle)' : '🔊 Audio Active (Tap to Toggle)', CANVAS_WIDTH / 2, 650);

      ctx.restore();
    }

    function drawHUD() {
      ctx.save();

      // Current Score
      ctx.fillStyle = '#ffffff';
      ctx.font = '600 20px "Segoe UI", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`Score: ${score}s`, 22, 38);

      // High Score
      ctx.fillStyle = '#ffd700';
      ctx.font = '600 15px "Segoe UI", sans-serif';
      ctx.fillText(`Best: ${highScore}s`, 140, 38);

      // Hazard Tier (difficulty progression)
      const tier = getDifficultyTier() + 1;
      ctx.textAlign = 'right';
      ctx.fillStyle = tier > 3 ? '#ff7b00' : '#00f3ff';
      ctx.font = '600 15px "Segoe UI", sans-serif';
      ctx.fillText(`Hazard Tier ${tier}`, CANVAS_WIDTH - 22, 36);

      // Tappable Mute Button in HUD
      ctx.font = '12px "Segoe UI", sans-serif';
      ctx.fillStyle = isMuted ? '#ef4444' : '#94a3b8';
      ctx.fillText(isMuted ? '🔇 Muted [M]' : '🔊 Sound [M]', CANVAS_WIDTH - 22, 56);

      // Active Power-Up Timers Display
      let badgeY = 66;

      // 1. Shield Badge
      if (shieldTimer > 0) {
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(0, 255, 136, 0.15)';
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 1;

        const badgeW = 145;
        const badgeH = 24;
        ctx.beginPath();
        ctx.roundRect(22, badgeY, badgeW, badgeH, 6);
        ctx.fill();
        ctx.stroke();

        const progress = shieldTimer / SHIELD_MAX_DURATION;
        ctx.fillStyle = 'rgba(0, 255, 136, 0.45)';
        ctx.beginPath();
        ctx.roundRect(24, badgeY + 2, (badgeW - 4) * progress, badgeH - 4, 4);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px "Segoe UI", sans-serif';
        ctx.fillText(`🛡️ SHIELD: ${shieldTimer.toFixed(1)}s`, 28, badgeY + 16);

        badgeY += 30;
      }

      // 2. Slow-Mo Badge
      if (slowMoTimer > 0) {
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(0, 212, 255, 0.15)';
        ctx.strokeStyle = '#00d4ff';
        ctx.lineWidth = 1;

        const badgeW = 145;
        const badgeH = 24;
        ctx.beginPath();
        ctx.roundRect(22, badgeY, badgeW, badgeH, 6);
        ctx.fill();
        ctx.stroke();

        const progress = slowMoTimer / SLOWMO_MAX_DURATION;
        ctx.fillStyle = 'rgba(0, 212, 255, 0.45)';
        ctx.beginPath();
        ctx.roundRect(24, badgeY + 2, (badgeW - 4) * progress, badgeH - 4, 4);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px "Segoe UI", sans-serif';
        ctx.fillText(`⏱ SLOW-MO: ${slowMoTimer.toFixed(1)}s`, 28, badgeY + 16);
      }

      ctx.restore();
    }

    function drawGameOverScreen() {
      ctx.save();

      ctx.fillStyle = 'rgba(4, 6, 13, 0.84)';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // "Game Over" Title
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff4d6d';
      ctx.font = '900 48px "Segoe UI", sans-serif';
      ctx.shadowColor = 'rgba(255, 77, 109, 0.7)';
      ctx.shadowBlur = 18;
      ctx.fillText('Game Over', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 80);

      // Final Score
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#f8f9fa';
      ctx.font = '600 24px "Segoe UI", sans-serif';
      ctx.fillText(`Final Score: ${finalScore} seconds`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 25);

      // High Score Info
      if (isNewHighScore) {
        ctx.fillStyle = '#ffd700';
        ctx.font = '700 18px "Segoe UI", sans-serif';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 10;
        ctx.fillText('★ NEW HIGH SCORE! ★', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 15);
      } else {
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 18px "Segoe UI", sans-serif';
        ctx.fillText(`High Score: ${highScore} seconds`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 15);
      }

      // Pulsing Restart Prompt
      const pulse = 0.65 + Math.sin(performance.now() / 240) * 0.35;
      ctx.shadowBlur = 0;
      ctx.fillStyle = `rgba(0, 243, 255, ${pulse})`;
      ctx.font = '600 20px "Segoe UI", sans-serif';
      ctx.fillText('Press Space or Tap to restart', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 80);

      ctx.fillStyle = '#64748b';
      ctx.font = '13px "Segoe UI", sans-serif';
      ctx.fillText(isMuted ? '🔇 Audio is Muted [M]' : '🔊 Audio is ON [M]', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 120);

      ctx.restore();
    }

    // =========================================================================
    // 12. MAIN GAME LOOP (DELTA TIME SCALED)
    // =========================================================================
    function gameLoop(timestamp) {
      if (!lastFrameTime) lastFrameTime = timestamp;

      // Delta time in seconds clamped to max 0.1s to prevent jumps on tab focus change
      const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.1);
      lastFrameTime = timestamp;

      // 1. Update Parallax Starfield
      updateStarfield(dt);

      // 2. Update Active Particle Explosions
      updateParticles(dt);

      // 3. Gameplay Updates
      if (gameState === 'PLAYING') {
        elapsedTime += dt;
        score = Math.floor(elapsedTime);
        if (score > highScore) {
          saveHighScore(score);
        }

        // Active power-up timers
        if (shieldTimer > 0) {
          shieldTimer = Math.max(0, shieldTimer - dt);
        }
        if (slowMoTimer > 0) {
          slowMoTimer = Math.max(0, slowMoTimer - dt);
        }

        // Update player position with keys if active
        player.update(dt);

        // Spawn Meteors
        meteorSpawnTimer += dt;
        const currentInterval = getCurrentSpawnInterval();
        if (meteorSpawnTimer >= currentInterval) {
          meteorSpawnTimer = 0;
          meteors.push(new Meteor());
        }

        // Spawn Power-Up Orbs
        powerUpSpawnTimer += dt;
        if (powerUpSpawnTimer >= POWER_UP_INTERVAL) {
          powerUpSpawnTimer = 0;
          spawnPowerUp();
        }

        // Update Power-Up Orbs & Check Collection
        for (let i = powerUps.length - 1; i >= 0; i--) {
          const pu = powerUps[i];
          pu.update(dt);

          const distToShip = Math.hypot(pu.x - player.x, pu.y - player.y);
          if (distToShip < pu.radius + player.height / 2) {
            if (pu.type === 'shield') {
              shieldTimer = SHIELD_MAX_DURATION;
            } else if (pu.type === 'slowmo') {
              slowMoTimer = SLOWMO_MAX_DURATION;
            }
            createPowerUpPickupBurst(pu.x, pu.y, pu.primaryColor);
            playBlipSound();
            powerUps.splice(i, 1);
            continue;
          }

          if (pu.y - pu.radius > CANVAS_HEIGHT + 20) {
            powerUps.splice(i, 1);
          }
        }

        // Update Meteors & Collision Checks
        const shipVertices = player.getVertices();

        for (let i = meteors.length - 1; i >= 0; i--) {
          const m = meteors[i];
          m.update(dt);

          // Shield active destroys meteors on contact
          if (shieldTimer > 0) {
            const distToShip = Math.hypot(m.x - player.x, m.y - player.y);
            if (distToShip <= player.shieldRadius + m.radius) {
              createMeteorShatterExplosion(m.x, m.y, m.radius);
              playShieldShatterSound();
              meteors.splice(i, 1);
              continue;
            }
          }

          // Direct collision check with triangle hull
          if (checkCircleTriangleCollision(m, shipVertices)) {
            triggerGameOver();
            break;
          }

          if (m.y - m.radius > CANVAS_HEIGHT + 20) {
            meteors.splice(i, 1);
          }
        }
      }

      // ----------------- RENDERING -----------------
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Starfield
      drawStarfield(timestamp / 1000);

      // Slow-Mo Cyan Ambient Aura
      if (slowMoTimer > 0 && gameState === 'PLAYING') {
        ctx.save();
        const slowAlpha = Math.min(0.2, (slowMoTimer / SLOWMO_MAX_DURATION) * 0.2);
        ctx.fillStyle = `rgba(0, 180, 255, ${slowAlpha})`;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.restore();
      }

      // Power-Up Orbs
      for (const pu of powerUps) {
        pu.draw(timestamp / 1000);
      }

      // Meteors
      for (const m of meteors) {
        m.draw();
      }

      // Player Ship
      if (gameState === 'PLAYING') {
        player.draw(timestamp / 1000);
      }

      // Particles
      drawParticles();

      // UI Overlays
      if (gameState === 'START') {
        drawStartScreen();
      } else if (gameState === 'PLAYING') {
        drawHUD();
      } else if (gameState === 'GAMEOVER') {
        drawGameOverScreen();
      }

      requestAnimationFrame(gameLoop);
    }

    // =========================================================================
    // 13. INITIALIZATION
    // =========================================================================
    initStarfield();
    requestAnimationFrame(gameLoop);
  </script>
